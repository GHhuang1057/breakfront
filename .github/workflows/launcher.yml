name: launcher

on:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore launcher/Geekhonize.Desktop/Geekhonize.Desktop.csproj
      - name: Build (Release)
        run: dotnet build launcher/Geekhonize.Desktop/Geekhonize.Desktop.csproj -c Release --no-restore
      - name: Publish linux-x64
        run: dotnet publish launcher/Geekhonize.Desktop/Geekhonize.Desktop.csproj -c Release -r linux-x64 --self-contained true -o dist/linux
      - uses: actions/upload-artifact@v4
        with:
          name: geekhonize-launcher-linux-x64
          path: dist/linux

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore launcher/Geekhonize.Desktop/Geekhonize.Desktop.csproj
      - name: Build (Release)
        run: dotnet build launcher/Geekhonize.Desktop/Geekhonize.Desktop.csproj -c Release --no-restore
      - name: Publish win-x64
        run: dotnet publish launcher/Geekhonize.Desktop/Geekhonize.Desktop.csproj -c Release -r win-x64 --self-contained true -o dist/win
      - uses: actions/upload-artifact@v4
        with:
          name: geekhonize-launcher-win-x64
          path: dist/win

  android:
    runs-on: ubuntu-latest
    continue-on-error: true   # B1.5：workload/SDK 链路成熟中，失败不阻塞主绿线
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install android workload
        run: dotnet workload install android --skip-manifest-update
      - name: Publish APK (net8.0-android)
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          dotnet publish launcher/Geekhonize.Android/Geekhonize.Android.csproj -c Release \
            -f net8.0-android \
            -p:AndroidSdkDirectory=/usr/local/lib/android/sdk \
            -o dist/android
          find dist/android -name '*.apk' -exec cp {} dist/android/geekhonize-launcher-android.apk \; 2>/dev/null || true
          ls -la dist/android/ | grep -i apk || true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: geekhonize-launcher-android
          path: dist/android/*.apk

  release:
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: geekhonize-launcher-win-x64
          path: art/win
      - uses: actions/download-artifact@v4
        with:
          name: geekhonize-launcher-linux-x64
          path: art/linux
      - uses: actions/download-artifact@v4
        if: needs.android.result == 'success'
        with:
          name: geekhonize-launcher-android
          path: art/android
      - name: Package zips (+ apk if present)
        run: |
          cd art/win  && zip -qr ../../geekhonize-launcher-win-x64.zip   . && cd ../..
          cd art/linux && zip -qr ../../geekhonize-launcher-linux-x64.zip . && cd ../..
          if [ -d art/android ]; then
            find art/android -name '*.apk' -exec cp {} ./geekhonize-launcher-android.apk \; 2>/dev/null || true
          fi
          ls -la geekhonize-launcher-*
      - name: Publish prerelease (launcher-dev-<sha>)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${GITHUB_SHA::7}"
          TAG="launcher-dev-${SHA}"
          gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true
          ASSETS="geekhonize-launcher-win-x64.zip geekhonize-launcher-linux-x64.zip"
          if [ -f geekhonize-launcher-android.apk ]; then ASSETS="$ASSETS geekhonize-launcher-android.apk"; fi
          NOTES=".NET/Avalonia 专属启动器（Geekhonize 登录→写入会话→启动游戏）。Win/Linux x64 自包含。"
          if [ -f geekhonize-launcher-android.apk ]; then NOTES="$NOTES Android APK 已产出。"; fi
          gh release create "${TAG}" ${ASSETS} \
            --prerelease \
            --title "BREAKFRONT Launcher dev build (${SHA})" \
            --notes "${NOTES}"
