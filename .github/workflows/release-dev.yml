name: release-dev

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'maps/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build mods
        run: gradle --no-daemon :core:build :client:build

      - name: Assemble dev pack
        env:
          CORE_JAR: core/build/libs/breakfront-0.1.0.jar
          CLIENT_JAR: client/build/libs/breakfront-client-0.1.0.jar
        run: |
          SHORT=$(git rev-parse --short HEAD)
          echo "RELEASE_TAG=dev-${SHORT}" >> "$GITHUB_ENV"
          python3 pack/tools/assemble_dev_release.py \
            --sha "$SHORT" \
            --core-jar "$CORE_JAR" \
            --client-jar "$CLIENT_JAR" \
            --out pack/dist
          ls -lh pack/dist

      - name: Publish dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          gh release create "dev-${SHORT}" \
            "pack/dist/breakfront-dev-client-mods-${SHORT}.zip" \
            "pack/dist/breakfront-dev-manifest-${SHORT}.json" \
            "core/build/libs/breakfront-0.1.0.jar" \
            "client/build/libs/breakfront-client-0.1.0.jar" \
            --repo "$GITHUB_REPOSITORY" \
            --title "BREAKFRONT dev build ${SHORT}" \
            --notes "开发版整合包（自动发布）：
            - 客户端 mods 包：解压后放入 Fabric Loader 0.19.5 的 .minecraft/mods
            - 版本锁定：Minecraft 1.21.1 / Fabric API / TaCZ: Refabricated
            - 由 GitHub Actions 自动构建，内容见 manifest.json" \
            --prerelease || true
