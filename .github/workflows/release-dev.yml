name: release-dev

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'maps/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build mods
        run: gradle --no-daemon :core:build :client:build

      - name: Assemble dev pack
        env:
          CORE_JAR: core/build/libs/breakfront-0.1.0.jar
          CLIENT_JAR: client/build/libs/breakfront-client-0.1.0.jar
        run: |
          SHORT=$(git rev-parse --short HEAD)
          echo "RELEASE_TAG=dev-${SHORT}" >> "$GITHUB_ENV"
          python3 pack/tools/assemble_dev_release.py \
            --sha "$SHORT" \
            --core-jar "$CORE_JAR" \
            --client-jar "$CLIENT_JAR" \
            --out pack/dist
          ls -lh pack/dist

      - name: Assemble server pack (one-click)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SHORT=$(git rev-parse --short HEAD)
          # fabric-installer 生成服务端运行骨架（下载 MC server 本体与运行库）
          curl -sL -o /tmp/fabric-installer.jar \
            https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.1.2/fabric-installer-1.1.2.jar
          mkdir -p /tmp/bfserver
          java -jar /tmp/fabric-installer.jar server -mcversion 1.21.1 -loader 0.19.5 \
            -dir /tmp/bfserver >/dev/null 2>&1
          python3 pack/tools/assemble_server_pack.py \
            --sha "$SHORT" \
            --client-zip "pack/dist/breakfront-dev-client-mods-${SHORT}.zip" \
            --stage /tmp/bfserver \
            --out pack/dist
          ls -lh pack/dist/breakfront-dev-server-${SHORT}.zip

      - name: Publish dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          gh release create "dev-${SHORT}" \
            "pack/dist/breakfront-dev-client-mods-${SHORT}.zip" \
            "pack/dist/breakfront-dev-server-${SHORT}.zip" \
            "pack/dist/breakfront-dev-manifest-${SHORT}.json" \
            "core/build/libs/breakfront-0.1.0.jar" \
            "client/build/libs/breakfront-client-0.1.0.jar" \
            --repo "$GITHUB_REPOSITORY" \
            --title "BREAKFRONT dev build ${SHORT}" \
            --notes "开发版整合包（自动发布）：
            - 客户端 mods 包：解压后放入 Fabric Loader 0.19.5 的 .minecraft/mods
            - 服务端一键包：解压后运行 start.bat（或 java -jar fabric-server-launch.jar nogui），
              放入 world/ 即加载战场图；首启自动生成超平坦竞技场并跳过自建城市
            - 版本锁定：Minecraft 1.21.1 / Fabric API / TaCZ: Refabricated
            - 由 GitHub Actions 自动构建，内容见 manifest.json" \
            --prerelease || true

      # 发布完成后经 frp SSH 隧道（中继 103.24.217.132:10022 → MC 主机）立即触发远程热更。
      # 需要仓库 Secrets：BF_SSH_KEY(私钥) / BF_HOST / BF_PORT / BF_USER；未配置时本步自动跳过，
      # 服务器 30s 轮询守卫仍会兜底完成更新。远程端有 update.lock 防并发，与轮询互不冲突。
      - name: Trigger remote hot-deploy (frp SSH)
        env:
          BF_SSH_KEY: ${{ secrets.BF_SSH_KEY }}
          BF_HOST: ${{ secrets.BF_HOST }}
          BF_PORT: ${{ secrets.BF_PORT }}
          BF_USER: ${{ secrets.BF_USER }}
        run: |
          if [ -z "$BF_SSH_KEY" ]; then
            echo 'BF_SSH_KEY secret not configured -> skip remote trigger (guard polls every 30s)'
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$BF_SSH_KEY" > ~/.ssh/bf_deploy && chmod 600 ~/.ssh/bf_deploy
          H="${BF_HOST:-103.24.217.132}"
          P="${BF_PORT:-10022}"
          U="${BF_USER:-Administrator}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 -i ~/.ssh/bf_deploy -p "$P" \
            "$U@$H" 'powershell -NoProfile -ExecutionPolicy Bypass -File C:\bfdeploy\bf_autoupdater.ps1' \
            || echo 'remote trigger failed (guard will catch within 30s)'
