name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build with Gradle
        run: gradle --no-daemon :core:build :client:build

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: breakfront-jars
          path: |
            core/build/libs/breakfront-*.jar
            client/build/libs/breakfront-client-*.jar
          if-no-files-found: error
