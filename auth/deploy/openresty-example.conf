# openresty 反代示例（香港服务器 103.24.217.132，nginx/conf.d/geekhonize-auth.conf）
# 方案 A：子域 auth.geekhonize.top（Cloudflare 已 A 解析到本机）
server {
    listen 443 ssl http2;
    server_name auth.geekhonize.top;
    # ssl_certificate / ssl_certificate_key 由 1Panel/Cloudflare Origin 证书提供

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }
}

