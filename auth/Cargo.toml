[package]
name = "geekhonize-auth"
version = "0.1.0"
edition = "2021"
description = "Geekhonize 通用账号认证服务（跨作品：BREAKFRONT MC / 管理台 / 其它）"
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono"], default-features = false }
argon2 = "0.5"
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "geekhonize-auth"
path = "src/main.rs"
