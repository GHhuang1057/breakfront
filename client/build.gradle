plugins {
    id 'fabric-loom'
}

version = rootProject.findProperty('mod_version') ?: '0.1.0'
group = rootProject.findProperty('maven_group') ?: 'com.breakfront'

base {
    archivesName = 'breakfront-client'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.property('minecraft_version')}"
    mappings "net.fabricmc:yarn:${rootProject.property('yarn_mappings')}:v2"
    modImplementation "net.fabricmc:fabric-loader:${rootProject.property('loader_version')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.property('fabric_version')}"

    // 情境音乐 mp3 解码（LGPL，仅解码库，打进 mod jar 供运行时）
    implementation "com.googlecode.soundlibs:jlayer:1.0.1.4"
    include "com.googlecode.soundlibs:jlayer:1.0.1.4"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

loom {
    mixin {
        // 生产 jar（remap 到 intermediary）下 mixin @Inject method 字符串需要 refmap 定位
        defaultRefmapName = "breakfront-client.refmap.json"
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// 编译期桩：core 共享协议类型（com/breakfront/net、com/breakfront/game）
// 随源集编译参与类型检查，但绝不打包——运行时由 core 模组 jar 提供（见 fabric.mod depends breakfront）
tasks.withType(Jar).configureEach {
    exclude('com/breakfront/net/**')
    exclude('com/breakfront/game/**')
}
